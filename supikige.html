<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>スピキと ようがんジャンプ ― 50おん</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Klee+One:wght@600&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{
  --night:#24163F; --dusk:#4A2D7A; --lava:#FF5A1F; --magma:#FFC23D;
  --pumpkin:#FF9A2E; --ghost:#FBF6EC; --mint:#7FE3D0; --ink:#2A1A3E;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--night);font-family:"Zen Maru Gothic",sans-serif;color:var(--ghost);touch-action:manipulation}
canvas{display:block;position:fixed;inset:0;width:100vw;height:100vh}
.screen{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:2vh;padding:3vh 3vw;z-index:5}
.screen.on{display:flex}
button{font-family:inherit;border:none;cursor:pointer;color:var(--ink)}
button:focus-visible{outline:5px solid var(--mint);outline-offset:4px}
.big-play{width:min(30vh,40vw);height:min(30vh,40vw);border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFD27A,var(--pumpkin) 60%,#D9650F);box-shadow:0 1.2vh 0 #9C4208,0 0 6vh #FF9A2E88;font-size:min(14vh,18vw);display:grid;place-items:center;animation:bob 1.6s ease-in-out infinite}
.big-play:active{transform:translateY(1vh);box-shadow:0 .3vh 0 #9C4208}
@keyframes bob{50%{transform:translateY(-1.5vh) rotate(-3deg)}}
.title{font-weight:900;font-size:min(9vh,8vw);letter-spacing:.06em;text-align:center;line-height:1.15;text-shadow:0 .6vh 0 #00000055}
.title small{display:block;font-size:.45em;color:var(--magma);letter-spacing:.2em}
.corner{position:fixed;top:2vh;width:min(11vh,14vw);height:min(11vh,14vw);border-radius:28%;font-size:min(6vh,8vw);display:grid;place-items:center;background:var(--ghost);box-shadow:0 .7vh 0 #B9A9D6;z-index:20}
.corner.l{left:2vw}.corner.r{right:2vw}
.corner:active{transform:translateY(.5vh);box-shadow:0 .2vh 0 #B9A9D6}
#map,#board,#quiz{background:linear-gradient(#24163Fe8,#3A2563e8)}
#map{justify-content:flex-start;padding-top:15vh;overflow-y:auto}
.rows{display:grid;grid-template-columns:repeat(5,1fr);gap:2.4vh 2.4vw;width:min(96vw,150vh)}
.row{position:relative;aspect-ratio:1/1.05;border-radius:44% 44% 40% 40%;background:radial-gradient(circle at 35% 30%,#FFD27A,var(--pumpkin) 58%,#D9650F);box-shadow:0 1vh 0 #9C4208;font-family:"Klee One",serif;font-size:min(10vh,7vw);display:flex;flex-direction:column;align-items:center;justify-content:center}
.row::before{content:"";position:absolute;top:-1.4vh;left:50%;width:12%;height:18%;transform:translateX(-50%) rotate(8deg);background:#4E8A3A;border-radius:40% 40% 20% 20%}
.row .dots{display:flex;gap:.6vh;margin-top:.4vh}
.row .dots i{width:min(1.8vh,1.4vw);height:min(1.8vh,1.4vw);border-radius:50%;background:#00000033}
.row .dots i.got{background:var(--ghost);box-shadow:0 0 1vh #fff}
.row.done{background:radial-gradient(circle at 35% 30%,#FFF4B0,#FFD23D 58%,#E0A10F);box-shadow:0 1vh 0 #A67500,0 0 4vh #FFD23Daa}
.row:active{transform:translateY(.8vh);box-shadow:0 .2vh 0 #9C4208}
/* reward */
#reward{background:radial-gradient(circle,#5B3A8Cee,#24163Ff2)}
.card{background:var(--ghost);color:var(--ink);border-radius:5vh;padding:3vh 6vh;display:flex;align-items:center;gap:5vh;box-shadow:0 1.5vh 0 #B9A9D6;animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{from{transform:scale(.3)}}
.kana{font-family:"Klee One",serif;font-size:min(34vh,26vw);line-height:1;color:var(--lava)}
.pic{display:flex;flex-direction:column;align-items:center;font-size:min(20vh,15vw);line-height:1}
.pic span{font-size:min(6vh,5vw);margin-top:1vh;font-family:"Klee One",serif}
.pic span b{color:var(--lava)}
.btnrow{display:flex;gap:4vw}
.pill{min-width:min(22vh,28vw);height:min(15vh,18vw);border-radius:8vh;font-size:min(8vh,10vw);background:var(--mint);box-shadow:0 1vh 0 #3A9E8C}
.pill.alt{background:var(--ghost);box-shadow:0 1vh 0 #B9A9D6}
.pill:active{transform:translateY(.8vh);box-shadow:0 .2vh 0 #3A9E8C}
/* quiz */
.q{font-size:min(7vh,7vw);font-weight:900;text-align:center}
.q b{font-family:"Klee One",serif;color:var(--magma);font-size:1.5em}
.choices{display:flex;gap:6vw}
.choice{width:min(36vh,34vw);height:min(36vh,34vw);border-radius:50%;background:var(--ghost);font-family:"Klee One",serif;font-size:min(24vh,22vw);box-shadow:0 1.2vh 0 #B9A9D6;transition:box-shadow .3s}
.choice.hint{box-shadow:0 1.2vh 0 #B9A9D6,0 0 0 1.5vh var(--magma),0 0 8vh var(--magma);animation:bob 1s infinite}
.choice.no{animation:wig .4s}
@keyframes wig{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
/* board */
#board{justify-content:flex-start;padding-top:15vh;overflow-y:auto}
.grid{display:grid;grid-template-columns:repeat(10,1fr);direction:rtl;gap:1vh;width:min(96vw,130vh)}
.cell{direction:ltr;aspect-ratio:1;border-radius:22%;font-family:"Klee One",serif;font-size:min(5.6vh,4.6vw);background:#ffffff14;color:#ffffff40}
.cell.got{background:var(--ghost);color:var(--ink);box-shadow:0 .6vh 0 #B9A9D6}
.cell.blank{visibility:hidden}
.toast{position:fixed;left:50%;top:6vh;transform:translateX(-50%);font-size:min(7vh,8vw);font-weight:900;color:var(--magma);text-shadow:0 .5vh 0 #0006;z-index:30;pointer-events:none;opacity:0;transition:opacity .3s}
.toast.on{opacity:1}
/* parent settings */
#settings{background:#24163Ff5}
.set{background:var(--ghost);color:var(--ink);border-radius:3vh;padding:3vh 4vh;width:min(92vw,560px);font-size:18px;display:flex;flex-direction:column;gap:14px}
.set h2{margin:0;font-size:22px}
.set label{display:flex;justify-content:space-between;align-items:center;gap:12px}
.set select{font:inherit;font-size:16px;padding:6px 10px;border-radius:10px}
.set p{margin:0;font-size:14px;line-height:1.6;color:#5a4a70}
.set .rowb{display:flex;gap:10px;justify-content:flex-end}
.set button{font-size:16px;padding:10px 18px;border-radius:12px;background:#E8E0F4}
.set button.ok{background:var(--mint)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div class="toast" id="toast"></div>

<!-- タイトル -->
<section class="screen on" id="title">
  <div class="title"><small>スピキと</small>ようがん ジャンプ</div>
  <button class="big-play" id="startBtn" aria-label="はじめる">▶</button>
</section>

<!-- マップ -->
<section class="screen" id="map">
  <button class="corner l" id="toBoard" aria-label="50おんひょう">📖</button>
  <button class="corner r" id="toSet" aria-label="おうちのひとへ">⚙️</button>
  <button class="corner r bgmBtn" style="right:calc(4vw + min(11vh,14vw))" aria-label="おんがく">🎵</button>
  <div class="rows" id="rows"></div>
</section>

<!-- ゲーム中ボタン -->
<button class="corner l" id="homeBtn" aria-label="もどる" style="display:none">🏠</button>
<button class="corner r bgmBtn" id="gameBgm" aria-label="おんがく" style="display:none">🎵</button>

<!-- ごほうび -->
<section class="screen" id="reward">
  <div class="card" id="rewardCard">
    <div class="kana" id="rKana">あ</div>
    <div class="pic" id="rPic">🐜<span>あり</span></div>
  </div>
  <div class="btnrow">
    <button class="pill alt" id="againVoice" aria-label="もういちど きく">🔊</button>
    <button class="pill" id="nextBtn" aria-label="つぎへ">▶</button>
  </div>
</section>

<!-- クイズ -->
<section class="screen" id="quiz">
  <div class="q" id="qText">「<b>あ</b>」は どっち？</div>
  <div class="choices" id="choices"></div>
  <button class="corner r" id="qVoice" aria-label="もういちど きく">🔊</button>
</section>

<!-- 50音表 -->
<section class="screen" id="board">
  <button class="corner l" id="boardBack" aria-label="もどる">🏠</button>
  <div class="grid" id="grid"></div>
</section>

<!-- おうちのかたへ -->
<section class="screen" id="settings">
  <div class="set">
    <h2>おうちの方へ（設定）</h2>
    <label>はしる速さ
      <select id="sSpeed"><option value="0.7">ゆっくり</option><option value="1" selected>ふつう</option><option value="1.25">はやい</option></select></label>
    <label>コースの長さ
      <select id="sLen"><option value="4">みじかい</option><option value="6" selected>ふつう</option><option value="9">ながい</option></select></label>
    <label>空中ジャンプ
      <select id="sJump"><option value="3">3回まで（いちばんやさしい）</option><option value="2" selected>2回まで</option><option value="1">1回のみ</option></select></label>
    <label>BGMの音量
      <select id="sVol"><option value="0.25">小さめ</option><option value="0.5" selected>ふつう</option><option value="0.8">大きめ</option></select></label>
    <label>声のはやさ
      <select id="sRate"><option value="0.7">ゆっくり</option><option value="0.9" selected>ふつう</option></select></label>
    <p>・画面のどこをタップしてもジャンプします（キーボードはスペース）。<br>・溶岩に落ちても「あちち！」と跳ね上がるだけで、失敗やゲームオーバーはありません。<br>・音声が出ない場合は、端末のマナーモードと音量を確認してください。</p>
    <div class="rowb"><button id="resetBtn">記録をリセット</button><button class="ok" id="setClose">とじる</button></div>
  </div>
</section>

<script>
/* ================= データ ================= */
const ROWS = [
 [["あ","🐜","あり"],["い","🐶","いぬ"],["う","🐰","うさぎ"],["え","✏️","えんぴつ"],["お","🍙","おにぎり"]],
 [["か","🎃","かぼちゃ"],["き","🦒","きりん"],["く","🚗","くるま"],["け","🍰","けーき"],["こ","🐨","こあら"]],
 [["さ","🐟","さかな"],["し","🦌","しか"],["す","🍉","すいか"],["せ","🧼","せっけん"],["そ","🍦","そふとくりーむ"]],
 [["た","🥚","たまご"],["ち","🦋","ちょうちょ"],["つ","🌙","つき"],["て","✋","て"],["と","🍅","とまと"]],
 [["な","🍆","なす"],["に","🥕","にんじん"],["ぬ","🧸","ぬいぐるみ"],["ね","🐱","ねこ"],["の","📓","のーと"]],
 [["は","🌸","はな"],["ひ","✈️","ひこうき"],["ふ","🚢","ふね"],["へ","🐍","へび"],["ほ","⭐","ほし"]],
 [["ま","🥭","まんごー"],["み","🍊","みかん"],["む","🐛","むし"],["め","👓","めがね"],["も","🍑","もも"]],
 [["や","⛰️","やま"],null,["ゆ","⛄","ゆき"],null,["よ","⛵","よっと"]],
 [["ら","🦁","らいおん"],["り","🍎","りんご"],["る","🔍","るーぺ"],["れ","🍋","れもん"],["ろ","🚀","ろけっと"]],
 [["わ","🐊","わに"],null,null,null,["を","📖","ほんを よむ"],["ん","🍞","ぱん"]]
];
// 「を」「ん」は単語の頭にないので読み方を特別に
const SAY = {"を":"を。 ほんを よむ の、を","ん":"ん。 ぱん の、ん"};
const rowLetters = r => ROWS[r].filter(Boolean);

/* ================= 保存 ================= */
var BGM_OFF=false;
let save = {got:{}, set:{speed:1,len:6,jump:2,rate:0.9}};
try{const s=JSON.parse(localStorage.getItem("spikiKana")); if(s) save=Object.assign(save,s);}catch(e){}
if(save.set.bgm===false)BGM_OFF=true;
const persist=()=>{try{localStorage.setItem("spikiKana",JSON.stringify(save))}catch(e){}};

/* ================= 音声・効果音 ================= */
let jaVoice=null;
function pickVoice(){const v=speechSynthesis.getVoices().filter(v=>/ja/i.test(v.lang)); jaVoice=v.find(x=>/Kyoko|Nanami|Haruka|Google/i.test(x.name))||v[0]||null;}
if("speechSynthesis" in window){pickVoice(); speechSynthesis.onvoiceschanged=pickVoice;}
function say(t,cb){
  if(!("speechSynthesis" in window)){cb&&setTimeout(cb,800);return;}
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(t); u.lang="ja-JP"; if(jaVoice)u.voice=jaVoice;
  u.rate=save.set.rate; u.pitch=1.45; bgmDuck(true); u.onend=()=>{bgmDuck(false);cb&&cb();}; u.onerror=()=>bgmDuck(false); speechSynthesis.speak(u);
}
const sayLetter=(k,w)=> say(SAY[k]||`${k}。 ${w} の、${k}`);
let AC=null;
/* ---- BGM（その場で作曲・演奏するので音源ファイル不要） ---- */
const BGM={on:!BGM_OFF,gain:null,timer:null,step:0,next:0,base:(save.set.vol||.5)};
const N=n=>440*Math.pow(2,(n-69)/12);
// メロディ（MIDI番号、0=休み）16分 x 64ステップ：ゆかいなおばけマーチ
const MEL=[72,0,76,0,79,0,76,0, 74,0,77,0,81,0,77,0, 76,0,79,0,84,0,79,0, 77,76,74,0,72,0,0,0,
           72,0,76,0,79,0,81,0, 79,0,77,0,76,0,74,0, 76,0,74,0,72,0,71,0, 72,0,0,0,79,0,0,0];
const BAS=[48,55,52,55, 50,57,53,57, 52,59,55,59, 53,55,47,55, 48,55,52,57, 55,53,52,50, 48,52,50,43, 48,55,48,0];
function ensureAC(){AC=AC||new (window.AudioContext||window.webkitAudioContext)(); if(AC.state==="suspended")AC.resume();
  if(!BGM.gain){BGM.gain=AC.createGain();BGM.gain.gain.value=BGM.on?BGM.base*.5:0;BGM.gain.connect(AC.destination);} return AC;}
function note(f,t0,d,type,vol){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.value=f;
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+.01);g.gain.exponentialRampToValueAtTime(.0001,t0+d);
  o.connect(g).connect(BGM.gain);o.start(t0);o.stop(t0+d+.02);}
function bgmTick(){
  const spb=60/132/4; // 132BPMの16分
  while(BGM.next<AC.currentTime+.15){
    const i=BGM.step%64, t0=BGM.next;
    if(MEL[i])note(N(MEL[i]),t0,spb*1.8,"square",.07);
    if(i%2===0&&BAS[i/2])note(N(BAS[i/2]),t0,spb*1.6,"triangle",.16);
    if(i%4===0){note(70,t0,.09,"sine",.25);}           // ドン
    if(i%4===2){note(5200,t0,.03,"square",.02);}        // チッ
    BGM.step++;BGM.next+=spb;
  }
}
function bgmStart(){ensureAC(); if(BGM.timer)return; BGM.next=AC.currentTime+.05; BGM.timer=setInterval(bgmTick,40);}
function bgmSet(on){BGM.on=on;save.set.bgm=on;persist();ensureAC();
  BGM.gain.gain.setTargetAtTime(on?BGM.base*.5:0,AC.currentTime,.1);
  document.querySelectorAll(".bgmBtn").forEach(b=>b.textContent=on?"🎵":"🔇");}
function bgmDuck(d){if(!BGM.gain||!BGM.on)return;BGM.gain.gain.setTargetAtTime(BGM.base*(d?.15:.5),AC.currentTime,.08);}
function tone(f,d=.12,type="square",vol=.08,slide=0){
  try{ensureAC();
  const o=AC.createOscillator(),g=AC.createGain(),t=AC.currentTime;
  o.type=type;o.frequency.setValueAtTime(f,t); if(slide)o.frequency.exponentialRampToValueAtTime(f*slide,t+d);
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g).connect(AC.destination);o.start(t);o.stop(t+d);}catch(e){}
}
const sfx={
  jump:()=>tone(420,.15,"square",.06,1.9),
  pop:()=>{tone(880,.08,"triangle",.1);setTimeout(()=>tone(1320,.12,"triangle",.1),70)},
  ouch:()=>tone(300,.3,"sawtooth",.06,.4),
  win:()=>[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,.22,"triangle",.12),i*120)),
  no:()=>tone(200,.2,"triangle",.08,.8)
};

/* ================= 画面 ================= */
const $=id=>document.getElementById(id);
let mode="title";
function show(id){document.querySelectorAll(".screen").forEach(s=>s.classList.toggle("on",s.id===id)); $("homeBtn").style.display=id==="game"?"grid":"none"; $("gameBgm").style.display=id==="game"?"grid":"none"; mode=id;}
function toast(t,ms=900){const e=$("toast");e.textContent=t;e.classList.add("on");clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove("on"),ms);}

function buildMap(){
  const box=$("rows"); box.innerHTML="";
  ROWS.forEach((row,r)=>{
    const L=rowLetters(r), got=L.filter(x=>save.got[x[0]]).length;
    const b=document.createElement("button"); b.className="row"+(got===L.length?" done":"");
    b.setAttribute("aria-label",L[0][0]+"ぎょう");
    b.innerHTML=`<div>${L[0][0]}</div><div class="dots">${L.map(x=>`<i class="${save.got[x[0]]?"got":""}"></i>`).join("")}</div>`;
    b.onclick=()=>{ say(L[0][0]+"ぎょう"); startRow(r); };
    box.appendChild(b);
  });
}
function buildBoard(){
  const g=$("grid"); g.innerHTML="";
  for(let v=0;v<5;v++) for(let r=0;r<10;r++){
    const cellData = r===9 && v===4 ? ROWS[9][4] : ROWS[r][v];
    const c=document.createElement("button");
    if(!cellData){c.className="cell blank";g.appendChild(c);continue;}
    c.className="cell"+(save.got[cellData[0]]?" got":""); c.textContent=cellData[0];
    c.onclick=()=>{sfx.pop();sayLetter(cellData[0],cellData[2]);};
    g.appendChild(c);
  }
  // ん は最後の行の下に
  const n=ROWS[9][5]; const c=document.createElement("button");
  c.className="cell"+(save.got["ん"]?" got":""); c.textContent="ん"; c.style.gridColumn="10"; c.onclick=()=>{sfx.pop();sayLetter("ん","ぱん");};
  g.appendChild(c);
}

/* ================= 進行 ================= */
let cur={row:0,idx:0};
function startRow(r){
  const L=rowLetters(r);
  let i=L.findIndex(x=>!save.got[x[0]]); if(i<0)i=0;
  cur={row:r,idx:i}; startLevel();
}
function letterNow(){return rowLetters(cur.row)[cur.idx];}
function finishLevel(){
  const [k,e,w]=letterNow();
  save.got[k]=true; persist();
  $("rKana").textContent=k;
  $("rPic").innerHTML=`${e}<span>${w.replace(k,`<b>${k}</b>`)}</span>`;
  const card=$("rewardCard"); card.style.animation="none"; card.offsetHeight; card.style.animation="";
  show("reward"); sfx.win(); setTimeout(()=>sayLetter(k,w),500);
  confetti(60);
}
$("againVoice").onclick=()=>{const [k,,w]=letterNow();sayLetter(k,w);};
$("nextBtn").onclick=()=>{
  const L=rowLetters(cur.row);
  if(cur.idx<L.length-1){cur.idx++;startLevel();}
  else startQuiz();
};

/* --- クイズ（間違えても失敗にしない） --- */
let quizList=[],quizMiss=0;
function startQuiz(){
  const L=rowLetters(cur.row).map(x=>x[0]);
  quizList=[...L].sort(()=>Math.random()-.5).slice(0,3);
  show("quiz"); nextQuiz();
}
function nextQuiz(){
  if(!quizList.length){ sfx.win(); confetti(120); say("やったね！ ぜんぶ できたよ！",()=>{}); setTimeout(()=>{buildMap();show("map");},2600); return; }
  const ans=quizList[0]; quizMiss=0;
  const pool=Object.values(ROWS).flat().filter(Boolean).map(x=>x[0]).filter(x=>x!==ans);
  // 似ていない文字を選ぶ（同じ行以外から）
  const sameRow=rowLetters(cur.row).map(x=>x[0]);
  const others=pool.filter(x=>!sameRow.includes(x));
  const wrong=others[Math.floor(Math.random()*others.length)];
  const opts=Math.random()<.5?[ans,wrong]:[wrong,ans];
  $("qText").innerHTML=`「<b>${ans}</b>」は どっち？`;
  const box=$("choices"); box.innerHTML="";
  opts.forEach(o=>{
    const b=document.createElement("button"); b.className="choice"; b.textContent=o;
    b.onclick=()=>{
      if(o===ans){ sfx.pop(); confetti(40); say("せいかい！ "+ans); quizList.shift(); setTimeout(nextQuiz,1500); }
      else{ sfx.no(); b.classList.remove("no"); void b.offsetWidth; b.classList.add("no"); quizMiss++;
        say(o+" だね。 "+ans+" は こっち！");
        [...box.children].forEach(c=>{if(c.textContent===ans)c.classList.add("hint");}); }
    };
    box.appendChild(b);
  });
  setTimeout(()=>say(`${ans} は どっち？`),300);
}
$("qVoice").onclick=()=>say(`${quizList[0]} は どっち？`);

/* ================= ゲーム本体（Canvas） ================= */
const cv=$("cv"), ctx=cv.getContext("2d");
let W=960,H=540,S=1,DPR=1,OY=0;
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);cv.width=innerWidth*DPR;cv.height=innerHeight*DPR;S=Math.min(cv.height/H,cv.width/640);W=cv.width/S;OY=cv.height/S-H;}
addEventListener("resize",resize);resize();

const LAVA_Y=470, G=0.55, JV=-12.5;
let lvl=null, P=null, cam=0, parts=[], t=0, confs=[];
function startLevel(){
  const [k]=letterNow();
  const n=+save.set.len; const plats=[{x:-200,y:380,w:520}];
  let x=320, y=380;
  for(let i=0;i<n;i++){
    const gap=85+Math.random()*55;
    y=Math.max(300,Math.min(410,y+(Math.random()*90-45)));
    const w=150+Math.random()*90;
    plats.push({x:x+gap,y,w}); x+=gap+w;
  }
  const goal={x:x+100,y:380,w:360}; plats.push(goal);
  const bubbles=[];
  for(let i=1;i<plats.length-1;i+=Math.max(1,Math.floor((plats.length-2)/3))){
    const p=plats[i]; bubbles.push({x:p.x+p.w/2,y:p.y-120,got:false,ph:Math.random()*6});
    if(bubbles.length>=3)break;
  }
  lvl={k,plats,goal,bubbles,goalX:goal.x+170,done:false,startT:0};
  P={x:60,y:380,vy:0,air:0,ground:true,face:0,ouch:0,squash:0,run:true};
  cam=0; parts=[];
  show("game");
  say(`${k} を とりに いこう！`);
}
function jump(){
  if(mode!=="game"||!P||lvl.done)return;
  if(P.ground||P.air<+save.set.jump){
    if(!P.ground)P.air++;
    P.vy=JV; P.ground=false; P.squash=1; sfx.jump();
    for(let i=0;i<6;i++)parts.push({x:P.x,y:P.y,vx:(Math.random()-.5)*3,vy:Math.random()*2,l:30,c:"#FBF6EC"});
  }
}
cv.addEventListener("pointerdown",e=>{e.preventDefault();jump();});
addEventListener("keydown",e=>{if(e.code==="Space"||e.code==="ArrowUp"){e.preventDefault();jump();}});
$("homeBtn").onclick=()=>{speechSynthesis&&speechSynthesis.cancel();buildMap();show("map");};

function update(dt){
  t+=dt;
  if(mode!=="game"||!lvl)return;
  const sp=3.0*save.set.speed;
  if(!lvl.done){ P.x+=sp*dt; }
  P.vy+=G*dt; const prevY=P.y; P.y+=P.vy*dt;
  P.ground=false;
  for(const p of lvl.plats){
    if(P.x>p.x-6&&P.x<p.x+p.w+6&&prevY<=p.y+1&&P.y>=p.y&&P.vy>=0){
      P.y=p.y;P.vy=0;P.ground=true;P.air=0; if(P.squash<.3)P.squash=.6;
    }
  }
  // 溶岩：失敗にしない。ぽーんと跳ね上がる
  if(P.y>LAVA_Y-18){
    P.y=LAVA_Y-18; P.vy=-17; P.air=0; P.ouch=50; sfx.ouch(); toast("あちち！",700);
    for(let i=0;i<14;i++)parts.push({x:P.x,y:LAVA_Y-10,vx:(Math.random()-.5)*6,vy:-Math.random()*6,l:40,c:Math.random()<.5?"#FFC23D":"#FF5A1F"});
  }
  P.ouch=Math.max(0,P.ouch-dt); P.squash=Math.max(0,P.squash-.06*dt);
  // もじバブル
  for(const b of lvl.bubbles){
    const by=b.y+Math.sin(t*.05+b.ph)*10;
    if(!b.got&&Math.hypot(P.x-b.x,(P.y-40)-by)<60){
      b.got=true; sfx.pop(); say(lvl.k);
      for(let i=0;i<16;i++){const a=i/16*6.28;parts.push({x:b.x,y:by,vx:Math.cos(a)*4,vy:Math.sin(a)*4,l:35,c:"#7FE3D0"});}
    }
  }
  // ゴール
  if(!lvl.done&&P.x>=lvl.goalX){lvl.done=true;lvl.doneT=t;sfx.pop();confetti(40);}
  if(lvl.done&&t-lvl.doneT>55&&mode==="game"){ lvl.doneT=1e9; finishLevel(); }
  cam+=((P.x-W*0.3)-cam)*.12*dt;
  parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=.2*dt;p.l-=dt;}); parts=parts.filter(p=>p.l>0);
}

/* ---------- 描画 ---------- */
function rr(x,y,w,h,r){ctx.beginPath();ctx.roundRect?ctx.roundRect(x,y,w,h,r):ctx.rect(x,y,w,h);}
function drawBG(){
  const g=ctx.createLinearGradient(0,0,0,H); g.addColorStop(0,"#24163F");g.addColorStop(.7,"#5B3A8C");g.addColorStop(1,"#C2462A");
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.fillStyle="#24163F";ctx.fillRect(0,-OY,W,OY);
  // 月
  ctx.fillStyle="#FFF1C9";ctx.beginPath();ctx.arc(W-120,90,46,0,7);ctx.fill();
  ctx.fillStyle="#24163F";ctx.beginPath();ctx.arc(W-100,78,40,0,7);ctx.fill();
  // 星
  for(let i=0;i<40;i++){const x=(i*137.5-cam*.05)%(W+40);const y=(i*53)%260;ctx.globalAlpha=.4+.4*Math.sin(t*.05+i);ctx.fillStyle="#fff";ctx.fillRect((x+W+40)%(W+40)-20,y,2.5,2.5);}
  ctx.globalAlpha=1;
  // 遠くのお化けの丘
  ctx.fillStyle="#3A2563";
  for(let i=-1;i<8;i++){const x=i*260-((cam*.25)%260);ctx.beginPath();ctx.ellipse(x,430,190,120,0,Math.PI,0);ctx.fill();}
}
function drawLava(){
  const y=LAVA_Y;
  const g=ctx.createLinearGradient(0,y-20,0,H);g.addColorStop(0,"#FFC23D");g.addColorStop(.25,"#FF5A1F");g.addColorStop(1,"#B3261E");
  ctx.fillStyle=g;ctx.beginPath();ctx.moveTo(0,H);
  for(let x=0;x<=W+20;x+=20)ctx.lineTo(x,y+Math.sin((x+cam)*.03+t*.08)*6);
  ctx.lineTo(W,H);ctx.fill();
  // あわ
  for(let i=0;i<10;i++){const x=((i*173+cam*-1)%W+W)%W;const r=4+((t*.3+i*7)%10);ctx.fillStyle="#FFE08A";ctx.globalAlpha=.7;ctx.beginPath();ctx.arc(x,y+14+Math.sin(t*.1+i)*4,r*.6,0,7);ctx.fill();}
  ctx.globalAlpha=1;
}
function drawPlat(p,isGoal){
  const x=p.x-cam;
  if(x>W+50||x+p.w<-50)return;
  // 石の足場
  ctx.fillStyle="#2E1F4A";rr(x,p.y,p.w,LAVA_Y-p.y+20,18);ctx.fill();
  ctx.fillStyle="#6B4FA0";rr(x,p.y,p.w,26,14);ctx.fill();
  ctx.fillStyle="#8E73C4";rr(x+6,p.y+3,p.w-12,8,6);ctx.fill();
  // 小さいかぼちゃ
  if(!isGoal&&p.w>160){drawPumpkin(x+p.w-34,p.y,14);}
}
function drawPumpkin(x,y,r){
  ctx.fillStyle="#FF9A2E";for(const dx of [-r*.55,r*.55,0]){ctx.beginPath();ctx.ellipse(x+dx,y-r*.85,r*.7,r*.85,0,0,7);ctx.fill();}
  ctx.strokeStyle="#D9650F";ctx.lineWidth=2;ctx.beginPath();ctx.ellipse(x,y-r*.85,r*.3,r*.85,0,0,7);ctx.stroke();
  ctx.fillStyle="#4E8A3A";ctx.fillRect(x-2,y-r*1.9,4,r*.4);
}
function drawGoal(){
  const g=lvl.goal, x=lvl.goalX-cam, y=g.y;
  // 大きなかぼちゃの家
  const R=70;
  ctx.save();ctx.shadowColor="#FFC23D";ctx.shadowBlur=30;
  ctx.fillStyle="#FF9A2E";for(const dx of [-R*.6,R*.6,0]){ctx.beginPath();ctx.ellipse(x+dx,y-R,R*.75,R,0,0,7);ctx.fill();}
  ctx.restore();
  ctx.fillStyle="#4E8A3A";rr(x-6,y-R*2.15,12,26,4);ctx.fill();
  // 窓に文字
  ctx.fillStyle="#FFF4B0";ctx.beginPath();ctx.arc(x,y-R,46,0,7);ctx.fill();
  ctx.fillStyle="#FF5A1F";ctx.font="600 64px 'Klee One'";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(lvl.k,x,y-R+4);
  // ゴールのはた
  ctx.fillStyle="#FBF6EC";ctx.fillRect(x+110,y-170,6,170);
  ctx.fillStyle="#7FE3D0";ctx.beginPath();ctx.moveTo(x+116,y-170);ctx.lineTo(x+176,y-150+Math.sin(t*.1)*5);ctx.lineTo(x+116,y-130);ctx.fill();
}
function drawBubble(b){
  if(b.got)return;
  const x=b.x-cam,y=b.y+Math.sin(t*.05+b.ph)*10;
  ctx.fillStyle="rgba(127,227,208,.25)";ctx.beginPath();ctx.arc(x,y,40,0,7);ctx.fill();
  ctx.strokeStyle="#7FE3D0";ctx.lineWidth=4;ctx.stroke();
  ctx.fillStyle="#fff";ctx.globalAlpha=.7;ctx.beginPath();ctx.arc(x-14,y-16,7,0,7);ctx.fill();ctx.globalAlpha=1;
  ctx.fillStyle="#FBF6EC";ctx.font="600 46px 'Klee One'";ctx.textAlign="center";ctx.textBaseline="middle";ctx.fillText(b.k||lvl.k,x,y+3);
}

function drawSpiki(x,y,sc=1,state={}){
  if(!SPIKI.complete)return;
  ctx.save();ctx.translate(x,y);
  const sq=state.squash||0, run=state.run?Math.abs(Math.sin(t*.3)):0, ouch=state.ouch>0;
  const H0=118*sc, W0=H0*SPIKI.width/SPIKI.height;
  // かげ
  ctx.fillStyle="rgba(0,0,0,.25)";ctx.beginPath();ctx.ellipse(0,2,W0*.38,6*sc,0,0,7);ctx.fill();
  ctx.translate(0,-run*6*sc);
  ctx.rotate(state.air?-.12:(ouch?Math.sin(t*1.5)*.15:0));
  ctx.scale(1+sq*.14,1-sq*.14);
  ctx.drawImage(SPIKI,-W0/2,-H0,W0,H0);
  if(ouch){ctx.globalCompositeOperation="source-atop";}
  ctx.restore();
  if(ouch){ // あちちの湯気
    ctx.fillStyle="#FFC23D";ctx.font="900 "+(28*sc)+"px 'Zen Maru Gothic'";ctx.textAlign="center";
    ctx.fillText("💦",x+W0*.45,y-H0*.95);
  }
}
function drawParts(){parts.forEach(p=>{ctx.globalAlpha=Math.min(1,p.l/20);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x-cam,p.y,4,0,7);ctx.fill();});ctx.globalAlpha=1;}
function confetti(n){const cols=["#FF9A2E","#7FE3D0","#FFC23D","#FBF6EC","#FFB3C1"];for(let i=0;i<n;i++)confs.push({x:Math.random()*W,y:-20-Math.random()*200,vy:2+Math.random()*3,vx:(Math.random()-.5)*2,r:Math.random()*6,c:cols[i%5],l:240});}
function drawConf(dt){confs.forEach(c=>{c.x+=c.vx*dt;c.y+=c.vy*dt;c.r+=.1*dt;c.l-=dt;ctx.save();ctx.translate(c.x,c.y);ctx.rotate(c.r);ctx.fillStyle=c.c;ctx.fillRect(-6,-3,12,6);ctx.restore();});confs=confs.filter(c=>c.l>0&&c.y<H+20);}

function drawTitleScene(){
  drawBG(); cam+=1; drawLava();
  // 浮かぶスピキ
  if(mode==="title"){drawSpiki(Math.max(110,W/2-300),H*0.86-40+Math.sin(t*.06)*8,1.7,{run:false});
  drawPumpkin(Math.min(W-50,W/2+300),H*.86-60,30);drawPumpkin(Math.min(W-110,W/2+230),H*.86-50,18);}
}
let last=performance.now();
function loop(now){
  let dt=Math.min(2.5,(now-last)/16.67); last=now;
  update(dt);
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle="#24163F";ctx.fillRect(0,0,cv.width,cv.height);
  ctx.setTransform(S,0,0,S,0,OY*S);
  if(mode==="game"&&lvl){
    drawBG();
    lvl.plats.forEach(p=>drawPlat(p,p===lvl.goal));
    drawGoal(); lvl.bubbles.forEach(drawBubble);
    drawLava(); drawParts();
    drawSpiki(P.x-cam,P.y,1,{run:P.ground&&!lvl.done,air:!P.ground,ouch:P.ouch,squash:P.squash});
    // あつめたバブル表示
    const got=lvl.bubbles.filter(b=>b.got).length;
    for(let i=0;i<lvl.bubbles.length;i++){ctx.fillStyle=i<got?"#7FE3D0":"#ffffff30";ctx.beginPath();ctx.arc(W/2-40+i*40,48,14,0,7);ctx.fill();}
    // ガイド：最初だけ「タップでジャンプ」
    if(P.x<300){ctx.globalAlpha=.6+.4*Math.sin(t*.12);ctx.fillStyle="#FBF6EC";ctx.font="900 34px 'Zen Maru Gothic'";ctx.textAlign="center";ctx.fillText("👆 タップで ジャンプ！",W/2,120);ctx.globalAlpha=1;}
  } else { t+=dt; drawTitleScene(); }
  drawConf(dt);
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

/* ================= ボタン ================= */
document.querySelectorAll(".bgmBtn").forEach(b=>{b.textContent=BGM.on?"🎵":"🔇";b.onclick=e=>{e.stopPropagation();bgmSet(!BGM.on);};});
$("startBtn").onclick=()=>{bgmStart();sfx.pop();say("スピキと いっしょに、もじを あつめよう！");buildMap();show("map");};
$("toBoard").onclick=()=>{buildBoard();show("board");say("あつめた もじだよ");};
$("boardBack").onclick=()=>{buildMap();show("map");};
$("toSet").onclick=()=>{$("sSpeed").value=save.set.speed;$("sLen").value=save.set.len;$("sJump").value=save.set.jump;$("sRate").value=save.set.rate;$("sVol").value=save.set.vol||0.5;show("settings");};
$("setClose").onclick=()=>{save.set={speed:+$("sSpeed").value,len:+$("sLen").value,jump:+$("sJump").value,rate:+$("sRate").value,vol:+$("sVol").value,bgm:BGM.on};persist();BGM.base=save.set.vol;bgmSet(BGM.on);buildMap();show("map");};
$("resetBtn").onclick=()=>{if(confirm("あつめた文字の記録を消しますか？")){save.got={};persist();buildMap();}};
if(location.hash==="#demo"){buildMap();startRow(1);for(let i=0;i<90;i++)update(1);}
if(location.hash==="#map"){buildMap();show("map");}
